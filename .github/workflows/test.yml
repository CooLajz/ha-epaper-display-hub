name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[test]'
      - run: ruff check .
      - run: mypy custom_components/coolajz_epaper_display_hub
      - run: pytest --cov=custom_components.coolajz_epaper_display_hub --cov-report=term-missing
